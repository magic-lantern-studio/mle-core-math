name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  push:
    branches: [ "master" ]
  #pull_request:
  #  branches: [ "master" ]

env:
  MLE_ROOT: C:\opt\MagicLantern
  
jobs:
  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Add msbuild to Path
        uses: microsoft/setup-msbuild@v2
        with:
            msbuild-architecture: x64
      # Download the latest mle-core-util artifact (libraries and headers)
      # produced by its Windows workflow into %MLE_ROOT%.
      - name: Download mle-core-util artifacts
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir %MLE_ROOT%
          gh run download --repo magic-lantern-studio/mle-core-util --name mle-core-util-windows-Release --dir %MLE_ROOT%
          dir /s /b %MLE_ROOT%
      - name: Build with msbuild
        shell: cmd
        run: |
          cd math\win32\build\msvc17
          msbuild mlmath.sln /p:Configuration=Release /p:Platform=x64
