name: Continuous Integration Build (Ubuntu 24.04)

on:
  workflow_dispatch:  # Allow manual triggers
  push:
    branches: [ "master" ]

env:
  MLE_ROOT: ${{ github.workspace }}/MagicLantern

jobs:
  ubuntu-build:
    name: Ubuntu 24.04 Build (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      # Download the latest mle-core-util artifact (libraries and headers)
      # produced by its Ubuntu 24.04 workflow into $MLE_ROOT.
      - name: Download mle-core-util artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            --repo magic-lantern-studio/mle-core-util \
            --name mle-core-util-ubuntu-24.04-${{ matrix.build_type }} \
            --dir "$MLE_ROOT"
          ls -R "$MLE_ROOT"

      - name: Configure
        run: >
          cmake -S math/linux/libmlmath -B build_${{ matrix.build_type }}
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage
          -DCMAKE_PREFIX_PATH="$MLE_ROOT"

      - name: Build
        run: cmake --build build_${{ matrix.build_type }} --parallel

      - name: Install (staged)
        run: cmake --install build_${{ matrix.build_type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mle-core-math-ubuntu-24.04-${{ matrix.build_type }}
          path: stage
